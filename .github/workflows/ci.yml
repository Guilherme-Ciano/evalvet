name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod, check-latest: true }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.15.0 }
      - run: go -C tools run ./nocomments ..
      - run: go mod tidy -diff
      - run: go tool -modfile=tools/go.mod govulncheck ./...
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod, check-latest: true }
      - run: go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=cover.out ./...
      - run: go -C tools test ./...
      - run: go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: cover.out }
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - run: go build ./...
      - run: go run ./cmd/evalvet version
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { pkg: ./internal/config, fn: FuzzParse }
          - { pkg: ./internal/cache, fn: FuzzCanonicalJSON }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - run: go test -run='^$' -fuzz='^${{ matrix.target.fn }}$' -fuzztime=45s ${{ matrix.target.pkg }}
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - run: make build
      - name: seeded regression must exit 1
        run: |
          set +e
          go run ./bench/cmd/demo
          code=$?
          test "$code" -eq 1
      - name: no regression must exit 0
        run: DEMO_MODEL=mock-good go run ./bench/cmd/demo
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compose demo exits 1 on the seeded regression
        run: |
          set +e
          docker compose up --build --abort-on-container-exit --exit-code-from evalvet
          code=$?
          test "$code" -eq 1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target evalvet .
